[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "listai"
version = "0.1.0"
description = "Understanding Neural Networks Through Python Lists — Pure Python List Engine vs Independent NumPy Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ListAI Engineering"}
]
dependencies = [
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["listai*"]
